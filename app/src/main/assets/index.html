<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141418">
<title>听书播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #141418;
    --panel: #1e1e24;
    --panel2: #26262e;
    --text: #e8e8ec;
    --text-dim: #9a9aa6;
    --accent: #5b8cff;
    --accent-soft: rgba(91, 140, 255, 0.18);
    --danger: #ff6b6b;
    --radius: 14px;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    padding: 14px 16px 8px;
    text-align: center;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  header .file-name {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90vw;
    margin-left: auto; margin-right: auto;
  }

  /* ---- 书单选择区 ---- */
  #setup {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 24px 48px;
    overflow-y: auto;
    text-align: center;
  }
  #setup .tip { color: var(--text-dim); font-size: 15px; line-height: 1.8; }
  #book-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 440px;
  }
  .book-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 15px 18px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1.5px solid #35353f;
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  .book-row:active { transform: scale(0.98); }
  .book-row .bk-name {
    flex: 1;
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
  }
  .book-row .bk-count { flex-shrink: 0; color: var(--text-dim); font-size: 13.5px; }
  .book-row .bk-live { flex-shrink: 0; color: var(--accent); font-size: 12px; }
  .book-row.current { border-color: var(--accent); background: var(--accent-soft); }
  .big-btn {
    display: block;
    width: 100%;
    max-width: 340px;
    padding: 18px 20px;
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    background: var(--panel);
    border: 1.5px solid #35353f;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform 0.1s, border-color 0.2s;
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .hidden { display: none !important; }

  /* ---- 播放器主体 ---- */
  #player { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  #subtitle-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px 24px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .cue {
    padding: 13px 16px;
    margin: 0 auto 10px;
    max-width: 680px;
    font-size: 17px;
    line-height: 1.75;
    border-radius: 12px;
    background: transparent;
    color: var(--text-dim);
    cursor: pointer;
    transition: background 0.25s, color 0.25s;
    user-select: none;
  }
  .cue:active { background: var(--panel2); }
  .cue.active {
    background: var(--accent-soft);
    color: var(--text);
    font-weight: 600;
    border-left: 3px solid var(--accent);
  }

  /* ---- 控制面板 ---- */
  #controls {
    flex-shrink: 0;
    background: var(--panel);
    border-top: 1px solid #2c2c34;
    padding: 10px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .ctl-inner { max-width: 680px; margin: 0 auto; }

  #seek {
    width: 100%;
    height: 34px;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  #seek::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 3px;
    background: linear-gradient(to right, var(--accent) var(--fill, 0%), #3a3a44 var(--fill, 0%));
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    margin-top: -7px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: -6px;
    font-variant-numeric: tabular-nums;
  }

  .btn-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-top: 10px;
  }
  .ctl-btn {
    min-width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: var(--panel2);
    color: var(--text);
    font-size: 21px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.1s;
  }
  .ctl-btn:active { transform: scale(0.92); }
  .ctl-btn.main {
    width: 72px; height: 72px;
    background: var(--accent);
    color: #fff;
    font-size: 30px;
    box-shadow: 0 4px 16px rgba(91, 140, 255, 0.35);
  }
  .ctl-btn.small { min-width: 46px; height: 46px; font-size: 16px; }

  .sub-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .chip {
    padding: 9px 14px;
    border-radius: 20px;
    border: 1.5px solid #35353f;
    background: transparent;
    color: var(--text-dim);
    font-size: 14px;
    cursor: pointer;
  }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
  select.chip { -webkit-appearance: none; appearance: none; padding-right: 10px; }

  /* 播放器顶部工具栏 */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 4px 16px 8px;
    flex-shrink: 0;
  }
  .tbtn {
    border: none;
    background: var(--panel);
    color: var(--text);
    font-size: 14px;
    padding: 9px 16px;
    border-radius: 20px;
    cursor: pointer;
  }
  .tbtn:active { background: var(--panel2); }

  /* 通用底部弹层 */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 60;
    display: flex;
    align-items: flex-end;
  }
  .sheet {
    background: var(--panel);
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    border-radius: 18px 18px 0 0;
    padding: 10px 14px calc(18px + env(safe-area-inset-bottom));
    max-height: 72vh;
    overflow-y: auto;
  }
  .sheet-title { font-size: 16px; font-weight: 600; text-align: center; padding: 10px 0 6px; }
  .sheet-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 16px;
    border-radius: 12px;
    font-size: 16px;
    color: var(--text);
    cursor: pointer;
    margin-top: 8px;
    background: var(--panel2);
  }
  .sheet-item:active { opacity: 0.8; }
  .sheet-item .ic { font-size: 20px; }
  .sheet-item .desc { flex: 1; text-align: left; font-size: 13.5px; color: var(--text-dim); }
  .sheet-item.danger { color: var(--danger); }
  .sheet-input {
    width: 100%;
    margin-top: 12px;
    background: var(--panel2);
    border: 1.5px solid #3a3a44;
    border-radius: 12px;
    color: var(--text);
    font-size: 17px;
    padding: 13px 16px;
    outline: none;
  }
  .sheet-input:focus { border-color: var(--accent); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 12px; }
  .sheet-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    background: var(--panel2);
    color: var(--text);
  }
  .sheet-btn.primary { background: var(--accent); color: #fff; }
  .sheet-btn.danger { background: rgba(255, 107, 107, 0.18); color: var(--danger); }
  .sheet-quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .qchip {
    flex: 1 1 30%;
    min-width: 88px;
    padding: 12px 0;
    border-radius: 10px;
    border: 1.5px solid #35353f;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
  }
  .qchip:active { background: var(--panel2); }

  /* 书单卡片 */
  .book-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: var(--panel);
    border: 1.5px solid #35353f;
    cursor: pointer;
    transition: transform 0.1s;
    -webkit-touch-callout: none;
    user-select: none;
  }
  .book-card:active { transform: scale(0.985); }
  .book-card.current { border-color: var(--accent); }
  .book-card .cover {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }
  .book-card .info { flex: 1; min-width: 0; text-align: left; }
  .book-card .info .nm { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-card .info .sub { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .book-card .right { flex-shrink: 0; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .book-card .right .cnt { font-size: 12.5px; color: var(--text-dim); }
  .book-card .right .live { font-size: 11px; color: var(--accent); font-weight: 600; }

  #sleep-display {
    font-size: 14px;
    color: var(--text);
    background: var(--panel2);
    padding: 9px 16px;
    border-radius: 20px;
    font-variant-numeric: tabular-nums;
  }
  #sleep-display.warn { color: #ffb35b; }

  /* 定时关闭悬浮胶囊（不占按钮行） */
  #sleep-pill {
    position: fixed;
    top: 60px;
    right: 14px;
    z-index: 45;
    display: none;
    align-items: center;
    gap: 8px;
    background: rgba(30, 30, 36, 0.95);
    border: 1px solid #3a3a44;
    border-radius: 20px;
    padding: 8px 14px;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
  }
  #sleep-pill.show { display: flex; }
  #sleep-pill.warn { color: #ffb35b; border-color: #6b5327; }
  #sp-toggle { cursor: pointer; user-select: none; }
  #sleep-pill .sp-btn {
    display: none;
    border: none;
    background: var(--panel2);
    color: var(--text);
    border-radius: 14px;
    padding: 6px 11px;
    font-size: 13px;
    cursor: pointer;
  }
  #sleep-pill.open .sp-btn { display: inline-block; }

  /* 回到当前字幕按钮 */
  #back-to-cur {
    position: fixed;
    right: 16px;
    bottom: 200px;
    z-index: 40;
    display: none;
    padding: 11px 18px;
    border: none;
    border-radius: 22px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
    cursor: pointer;
  }
  #back-to-cur.show { display: block; }

  /* ---- 播放列表浮层 ---- */
  #pl-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 50;
    display: flex;
    align-items: flex-end;
  }
  #pl-overlay.hidden { display: none; }
  #pl-panel {
    background: var(--panel);
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    border-radius: 18px 18px 0 0;
    max-height: 62vh;
    display: flex;
    flex-direction: column;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #pl-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 10px;
    font-size: 16px;
    font-weight: 600;
  }
  #pl-head button {
    border: none;
    background: var(--panel2);
    color: var(--text);
    width: 36px; height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
  }
  #pl-list { overflow-y: auto; padding: 4px 10px 16px; }
  .pl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 13px 14px;
    border-radius: 10px;
    font-size: 15.5px;
    color: var(--text-dim);
    cursor: pointer;
    line-height: 1.4;
  }
  .pl-item:active { background: var(--panel2); }
  .pl-item .num { flex-shrink: 0; width: 26px; text-align: right; font-variant-numeric: tabular-nums; opacity: 0.7; }
  .pl-item .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-item.current { background: var(--accent-soft); color: var(--text); font-weight: 600; }
  .pl-item.current .num { opacity: 1; }

  #msg {
    position: fixed;
    left: 50%; bottom: 130px;
    transform: translateX(-50%);
    background: rgba(30,30,36,0.95);
    border: 1px solid #3a3a44;
    color: var(--text);
    font-size: 14.5px;
    padding: 12px 20px;
    border-radius: 12px;
    max-width: 85vw;
    text-align: center;
    z-index: 99;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  #msg.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>🎧 听书播放器</h1>
  <div class="file-name" id="file-name">未选择文件</div>
</header>

<!-- 书架界面 -->
<div id="setup">
  <div class="tip">📚 我的书架<br><span style="font-size:13px">点书单继续听 · 长按书单可重命名或删除</span></div>
  <div id="book-list"></div>
  <button class="big-btn primary" id="btn-pick">＋ 新建书单（选择音频，可多选）</button>
</div>

<!-- 播放器界面 -->
<div id="player" class="hidden">
  <div class="toolbar">
    <button class="tbtn" id="btn-books">📚 书架</button>
    <button class="tbtn" id="btn-list">☰ 本集列表</button>
  </div>
  <div id="subtitle-list"></div>

  <div id="controls">
    <div class="ctl-inner">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1">
      <div class="time-row">
        <span id="t-cur">00:00:00</span>
        <span id="t-total">00:00:00</span>
      </div>

      <div class="btn-row">
        <button class="ctl-btn" id="btn-back" title="后退 15 秒">⏪</button>
        <button class="ctl-btn main" id="btn-play" title="播放/暂停">▶</button>
        <button class="ctl-btn" id="btn-fwd" title="前进 15 秒">⏩</button>
      </div>

      <div class="sub-row">
        <button class="chip" id="btn-srt">📄 换字幕</button>
        <select class="chip" id="speed" title="倍速">
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.25">1.25x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
        <button class="chip" id="btn-sleep">⏰ 定时</button>
      </div>
    </div>
  </div>
</div>

<!-- 定时关闭悬浮胶囊 -->
<div id="sleep-pill">
  <span id="sp-toggle">⏰ <span id="sp-time">30:00</span></span>
  <button class="sp-btn" id="btn-sleep-add">+5 分钟</button>
  <button class="sp-btn" id="btn-sleep-cancel">取消</button>
</div>

<!-- 播放列表浮层 -->
<div id="pl-overlay" class="hidden">
  <div id="pl-panel">
    <div id="pl-head">
      <span>☰ 播放列表</span>
      <button id="pl-close">✕</button>
    </div>
    <div id="pl-list"></div>
  </div>
</div>

<button id="back-to-cur">↩ 回到当前</button>

<div id="msg"></div>

<!-- 隐藏的文件选择器 -->
<input type="file" id="input-audio" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple hidden>
<input type="file" id="input-srt" multiple hidden>

<script>
(function () {
  "use strict";

  // ---------- 状态 ----------
  var cues = [];            // [{start, end, text}]
  var activeIdx = -1;
  var scrollPending = false;

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var elSetup = $("setup"), elPlayer = $("player");
  var elFileName = $("file-name");
  var btnPick = $("btn-pick");
  var inputAudio = $("input-audio"), inputSrt = $("input-srt");
  var list = $("subtitle-list");
  var audio = new Audio();
  audio.preload = "metadata";

  var btnPlay = $("btn-play"), seek = $("seek");
  var tCur = $("t-cur"), tTotal = $("t-total");
  var speedSel = $("speed");
  var btnSleep = $("btn-sleep"), sleepPill = $("sleep-pill"), spTime = $("sp-time");
  var btnSleepAdd = $("btn-sleep-add"), btnSleepCancel = $("btn-sleep-cancel");

  // ---------- 工具 ----------
  var msgTimer = null;
  function showMsg(text, ms) {
    var m = $("msg");
    m.textContent = text;
    m.classList.add("show");
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { m.classList.remove("show"); }, ms || 2600);
  }

  // ---------- 通用底部弹层 ----------
  function openSheet(html) {
    var ov = document.createElement("div");
    ov.className = "sheet-overlay";
    ov.innerHTML = '<div class="sheet">' + html + "</div>";
    document.body.appendChild(ov);
    ov.addEventListener("click", function (e) {
      if (e.target === ov) ov.close();
    });
    ov.close = function () { ov.remove(); };
    return ov;
  }

  function nameSheet(title, defVal, cb) {
    var ov = openSheet(
      '<div class="sheet-title">' + title + "</div>" +
      '<input class="sheet-input" id="ninput" value="' + escapeHtml(defVal) + '">' +
      '<div class="sheet-actions">' +
        '<button class="sheet-btn" id="ncancel">取消</button>' +
        '<button class="sheet-btn primary" id="nok">确定</button>' +
      "</div>"
    );
    var input = ov.querySelector("#ninput");
    setTimeout(function () { input.focus(); }, 120);
    function done() {
      var v = input.value.trim();
      ov.close();
      cb(v || null);
    }
    ov.querySelector("#nok").addEventListener("click", done);
    ov.querySelector("#ncancel").addEventListener("click", function () { ov.close(); cb(null); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") done(); });
  }

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var h = Math.floor(t / 3600),
        m = Math.floor(t % 3600 / 60),
        s = Math.floor(t % 60);
    var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
    return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------- 字幕解析（SRT / VTT，支持 UTF-8 与 GBK 自动识别） ----------
  function parseTimestamp(line) {
    var m = line.match(/(\d{1,2}):(\d{1,2}):(\d{1,2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{1,2}):(\d{1,2})[,.](\d{1,3})/);
    if (!m) m = line.match(/(\d{1,2}):(\d{1,2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{1,2})[,.](\d{1,3})/);
    if (!m) return null;
    var g = m.map(Number);
    if (m.length === 9) {
      return { start: g[1] * 3600 + g[2] * 60 + g[3] + g[4] / 1000,
               end:   g[5] * 3600 + g[6] * 60 + g[7] + g[8] / 1000 };
    }
    return { start: g[1] * 60 + g[2] + g[3] / 1000,
             end:   g[4] * 60 + g[5] + g[6] / 1000 };
  }

  function decodeSubtitle(buffer) {
    // 先按 UTF-8 严格解码，失败则回退 GBK（很多老字幕是 GBK 编码）
    try {
      return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
    } catch (e) {
      try { return new TextDecoder("gbk").decode(buffer); }
      catch (e2) { return new TextDecoder("utf-8").decode(buffer); }
    }
  }

  function parseSrt(content) {
    var lines = content.replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "").split("\n");
    var out = [], cur = null;
    for (var i = 0; i < lines.length; i++) {
      var ts = parseTimestamp(lines[i]);
      if (ts) {
        if (cur) out.push(cur);
        cur = { start: ts.start, end: ts.end, text: "" };
        continue;
      }
      if (cur) {
        var line = lines[i].trim();
        if (!line) { if (cur.text) { out.push(cur); cur = null; } continue; }
        if (/^\d+$/.test(line) && !cur.text) continue; // 序号行
        cur.text += (cur.text ? "\n" : "") + line;
      }
    }
    if (cur && cur.text) out.push(cur);
    return out.filter(function (c) { return c.end > c.start || c.end === 0; });
  }

  // ---------- 字幕渲染 ----------
  function renderSubtitles() {
    list.innerHTML = "";
    if (!cues.length) return;
    var frag = document.createDocumentFragment();
    cues.forEach(function (c, i) {
      var div = document.createElement("div");
      div.className = "cue";
      div.dataset.idx = i;
      div.innerHTML = escapeHtml(c.text).replace(/\n/g, "<br>");
      div.addEventListener("click", function () {
        audio.currentTime = cues[i].start;
        if (audio.paused) audio.play();
        showMsg("跳转到 " + fmt(cues[i].start));
      });
      frag.appendChild(div);
    });
    list.appendChild(frag);
  }

  // ---------- 手动浏览检测：用户翻看时暂停自动滚动 8 秒 ----------
  var userBrowsingUntil = 0;
  var btnBackCur = $("back-to-cur");

  function userScrolling() { return Date.now() < userBrowsingUntil; }

  ["touchstart", "wheel", "mousedown"].forEach(function (ev) {
    list.addEventListener(ev, function () {
      userBrowsingUntil = Date.now() + 8000;
      updateBackBtn();
    }, { passive: true });
  });

  function updateBackBtn() {
    var a = list.querySelector(".cue.active");
    if (!a || !userScrolling()) {
      btnBackCur.classList.remove("show");
      return;
    }
    var r = a.getBoundingClientRect(), lr = list.getBoundingClientRect();
    var visible = r.bottom > lr.top && r.top < lr.bottom;
    btnBackCur.classList.toggle("show", !visible);
  }

  btnBackCur.addEventListener("click", function () {
    userBrowsingUntil = 0;
    var a = list.querySelector(".cue.active");
    if (a) {
      var top = a.offsetTop - list.clientHeight / 2 + a.clientHeight / 2;
      list.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }
    btnBackCur.classList.remove("show");
  });

  list.addEventListener("scroll", function () {
    if (scrollPending) return;
    updateBackBtn();
  }, { passive: true });

  function highlight(time) {
    var idx = -1;
    for (var i = 0; i < cues.length; i++) {
      if (time >= cues[i].start && time < (cues[i].end || cues[i].start + 5)) { idx = i; break; }
      if (cues[i].start > time) break;
    }
    // 没精确命中时，取最后一个已开始的
    if (idx === -1 && cues.length && time >= cues[0].start) {
      for (var j = cues.length - 1; j >= 0; j--) {
        if (cues[j].start <= time) { idx = j; break; }
      }
    }
    if (idx === activeIdx) return;
    var prev = list.querySelector(".cue.active");
    if (prev) prev.classList.remove("active");
    activeIdx = idx;
    if (idx >= 0) {
      var el = list.children[idx];
      if (el) {
        el.classList.add("active");
        if (!scrollPending && !userScrolling()) {
          scrollPending = true;
          setTimeout(function () {
            var a = list.querySelector(".cue.active");
            if (a && !userScrolling()) {
              var top = a.offsetTop - list.clientHeight / 2 + a.clientHeight / 2;
              list.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
            }
            scrollPending = false;
            updateBackBtn();
          }, 80);
        } else {
          updateBackBtn();
        }
      }
    }
  }

  // ---------- 播放列表与音频加载 ----------
  var tracks = [];        // [{name, base, url, file}]
  var srtMap = {};        // 文件名(不含扩展名) -> 已解析字幕
  var curTrack = -1;
  var plOverlay = $("pl-overlay"), plList = $("pl-list");

  // ---------- 进度记忆（按文件名存到浏览器本地存储） ----------
  function saveKey(base) { return "tl_pos_" + base; }
  var lastSaved = 0, pendingResume = null;

  function saveProgress() {
    if (curTrack < 0 || !tracks[curTrack] || !isFinite(audio.currentTime)) return;
    try {
      localStorage.setItem(saveKey(tracks[curTrack].base), JSON.stringify({
        t: audio.currentTime,
        d: audio.duration || 0,
        ts: Date.now()
      }));
    } catch (e) {}
  }
  function saveSettings() {
    try { localStorage.setItem("tl_speed", speedSel.value); } catch (e) {}
  }
  // 切后台 / 关页面时也存一次
  window.addEventListener("pagehide", saveProgress);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveProgress();
  });

  // ---------- 内容库 v2：多书单（books → tracks 两级，旧数据自动迁移） ----------
  var db = null;
  var books = [];
  var bookCount = {};
  var allTracks = {};
  var curBookId = null;
  var curBookName = "";

  function openDB() {
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open("audiobook_player", 2);
        req.onupgradeneeded = function () {
          var d = req.result;
          var tx = req.transaction;
          if (!d.objectStoreNames.contains("books")) d.createObjectStore("books", { keyPath: "id" });
          if (d.objectStoreNames.contains("tracks")) {
            // v1 旧库：单列表结构 → 迁移为默认书单
            tx.objectStore("tracks").getAll().onsuccess = function (ev) {
              var oldTracks = ev.target.result || [];
              d.deleteObjectStore("tracks");
              var st = d.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
              st.createIndex("bookId", "bookId");
              oldTracks.forEach(function (t, i) {
                st.put({ bookId: 1, name: t.name, base: t.base, blob: t.blob, order: i });
              });
              tx.objectStore("books").put({ id: 1, name: "我的书单" });
            };
          } else {
            var st = d.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
            st.createIndex("bookId", "bookId");
          }
          if (!d.objectStoreNames.contains("srts")) d.createObjectStore("srts", { keyPath: "base" });
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
  }
  function idbAll(store) {
    return new Promise(function (res) {
      if (!db) return res([]);
      try {
        db.transaction(store).objectStore(store).getAll().onsuccess = function (e) { res(e.target.result || []); };
      } catch (e) { res([]); }
    });
  }
  function idbPut(store, val) {
    return new Promise(function (res) {
      if (!db) return res();
      try {
        var t = db.transaction(store, "readwrite");
        t.objectStore(store).put(val);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }

  function loadSrts() {
    return idbAll("srts").then(function (list) {
      srtMap = {};
      list.forEach(function (s) {
        var p = parseSrt(s.text);
        if (p.length) srtMap[s.base] = p;
      });
    });
  }

  function refreshBooks() {
    return idbAll("books").then(function (bs) {
      books = bs.sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
      return idbAll("tracks");
    }).then(function (all) {
      bookCount = {};
      allTracks = {};
      all.forEach(function (t) {
        bookCount[t.bookId] = (bookCount[t.bookId] || 0) + 1;
        (allTracks[t.bookId] = allTracks[t.bookId] || []).push(t);
      });
      Object.keys(allTracks).forEach(function (k) {
        allTracks[k].sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      });
      renderBookList();
    });
  }

  function renderBookList() {
    var el = $("book-list");
    el.innerHTML = "";
    var lastId = 0;
    try { lastId = parseInt(localStorage.getItem("tl_lastbook") || "0", 10) || 0; } catch (e) {}
    var frag = document.createDocumentFragment();
    books.forEach(function (b) {
      var card = document.createElement("div");
      card.className = "book-card" + (b.id === curBookId ? " current" : "");
      var sub = "还没听过";
      var cnt = bookCount[b.id] || 0;
      try {
        var pos = JSON.parse(localStorage.getItem("tl_bookpos_" + b.id) || "null");
        if (pos && pos.i >= 0 && allTracks[b.id] && allTracks[b.id][pos.i]) {
          var t = allTracks[b.id][pos.i];
          var pr = JSON.parse(localStorage.getItem(saveKey(t.base)) || "null");
          var pct = pr && pr.d ? Math.min(100, Math.round(pr.t / pr.d * 100)) : 0;
          sub = "听到第 " + (pos.i + 1) + " 集" + (pct ? " · " + pct + "%" : "");
        }
      } catch (e) {}
      card.innerHTML =
        '<span class="cover">📖</span>' +
        '<span class="info"><div class="nm">' + escapeHtml(b.name) + "</div>" +
        '<div class="sub">' + sub + "</div></span>" +
        '<span class="right"><span class="cnt">' + cnt + " 集</span>" +
        (b.id === curBookId ? '<span class="live">▶ 正在播</span>' : "") + "</span>";
      var lpTimer = null, lpFired = false;
      card.addEventListener("click", function () {
        if (lpFired) { lpFired = false; return; }
        if (b.id === curBookId) {
          elSetup.classList.add("hidden");
          elPlayer.classList.remove("hidden");
        } else {
          saveProgress();
          openBook(b.id);
        }
      });
      // 长按 → 管理（重命名 / 删除）；桌面右键同样触发
      card.addEventListener("touchstart", function () {
        lpFired = false;
        lpTimer = setTimeout(function () { lpFired = true; bookManage(b); }, 550);
      }, { passive: true });
      card.addEventListener("touchend", function () { clearTimeout(lpTimer); });
      card.addEventListener("touchmove", function () { clearTimeout(lpTimer); }, { passive: true });
      card.addEventListener("contextmenu", function (e) { e.preventDefault(); bookManage(b); });
      frag.appendChild(card);
    });
    el.appendChild(frag);
  }

  // ---------- 书单管理（重命名 / 删除） ----------
  function bookManage(b) {
    var ov = openSheet(
      '<div class="sheet-title">' + escapeHtml(b.name) + "</div>" +
      '<div class="sheet-item"><span class="ic">✏️</span><span>重命名</span></div>' +
      '<div class="sheet-item danger"><span class="ic">🗑️</span><span>删除书单</span></div>'
    );
    var items = ov.querySelectorAll(".sheet-item");
    items[0].addEventListener("click", function () {
      ov.close();
      nameSheet("重命名书单", b.name, function (name) {
        if (!name) return;
        idbPut("books", { id: b.id, name: name }).then(refreshBooks);
        if (b.id === curBookId) curBookName = name;
        showMsg("已重命名");
      });
    });
    items[1].addEventListener("click", function () {
      ov.close();
      confirmDelete(b);
    });
  }

  function confirmDelete(b) {
    var ov = openSheet(
      '<div class="sheet-title">删除「' + escapeHtml(b.name) + '」？</div>' +
      '<div class="sheet-item" style="background:transparent;padding:4px 16px;"><span class="desc">该书单的所有音频和进度将无法恢复。</span></div>' +
      '<div class="sheet-actions">' +
        '<button class="sheet-btn" id="dcancel">再想想</button>' +
        '<button class="sheet-btn danger" id="dok">删除</button>' +
      "</div>"
    );
    ov.querySelector("#dok").addEventListener("click", function () {
      ov.close();
      deleteBook(b.id);
    });
    ov.querySelector("#dcancel").addEventListener("click", function () { ov.close(); });
  }

  function deleteBook(id) {
    idbAll("tracks").then(function (all) {
      var keys = all.filter(function (t) { return t.bookId === id; }).map(function (t) { return t.id; });
      return new Promise(function (res) {
        if (!db || !keys.length) return res();
        var tx = db.transaction("tracks", "readwrite");
        keys.forEach(function (k) { tx.objectStore("tracks").delete(k); });
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    }).then(function () {
      return new Promise(function (res) {
        if (!db) return res();
        var tx = db.transaction("books", "readwrite");
        tx.objectStore("books").delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    }).then(function () {
      if (curBookId === id) {
        curBookId = null; curBookName = ""; curTrack = -1; tracks = [];
        audio.pause();
        audio.removeAttribute("src");
        elPlayer.classList.add("hidden");
        elSetup.classList.remove("hidden");
      }
      try { localStorage.removeItem("tl_bookpos_" + id); } catch (e) {}
      refreshBooks();
      showMsg("书单已删除");
    });
  }

  function openBook(id) {
    return idbAll("tracks").then(function (all) {
      var rows = all.filter(function (t) { return t.bookId === id; })
                    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      if (!rows.length) { showMsg("这个书单是空的"); return; }
      tracks.forEach(function (t) { URL.revokeObjectURL(t.url); });
      tracks = rows.map(function (t) {
        return { name: t.name, base: t.base, url: URL.createObjectURL(t.blob), file: t.blob };
      });
      curBookId = id;
      for (var i = 0; i < books.length; i++) {
        if (books[i].id === id) curBookName = books[i].name;
      }
      try { localStorage.setItem("tl_lastbook", String(id)); } catch (e) {}
      curTrack = -1;
      elSetup.classList.add("hidden");
      elPlayer.classList.remove("hidden");
      renderPlaylist();
      // 恢复上次听到的那一集
      var startIdx = 0;
      try {
        var pos = JSON.parse(localStorage.getItem("tl_bookpos_" + id) || "null");
        if (pos && pos.i >= 0 && pos.i < tracks.length) startIdx = pos.i;
      } catch (e) {}
      playTrack(startIdx);
    });
  }

  // 启动：开库 → 载入字幕库 → 渲染书单
  openDB().then(function (d) {
    db = d;
    if (!db) { showMsg("本地存储不可用，文件无法保存"); return; }
    loadSrts().then(refreshBooks);
  });

  btnPick.addEventListener("click", function () { inputAudio.click(); });
  inputAudio.addEventListener("change", function () {
    var files = Array.prototype.slice.call(inputAudio.files);
    if (!files.length) return;
    var defaultName = files[0].name.replace(/\.[^.]+$/, "");
    nameSheet("给这个书单起个名字", defaultName, function (name) {
      if (!name) return;
      var bookId = Date.now();
      idbPut("books", { id: bookId, name: name }).then(function () {
        var chain = Promise.resolve();
        files.forEach(function (f, i) {
          chain = chain.then(function () {
            return idbPut("tracks", {
              bookId: bookId,
              name: f.name,
              base: f.name.replace(/\.[^.]+$/, ""),
              blob: f,
              order: i
            });
          });
        });
        return chain;
      }).then(function () {
        showMsg("书单「" + name + "」已创建");
        return refreshBooks();
      }).then(function () {
        return openBook(bookId);
      }).then(function () {
        setTimeout(function () { inputSrt.click(); }, 400);
      });
    });
  });

  function playTrack(i) {
    if (i < 0 || i >= tracks.length) return;
    curTrack = i;
    var t = tracks[i];
    audio.src = t.url;
    // 尝试恢复该文件的上次播放进度
    pendingResume = null;
    try {
      var raw = localStorage.getItem(saveKey(t.base));
      if (raw) {
        var o = JSON.parse(raw);
        if (o && isFinite(o.t) && o.t > 3) pendingResume = o.t;
      }
    } catch (e) {}
    try { localStorage.setItem("tl_bookpos_" + curBookId, JSON.stringify({ i: i })); } catch (e) {}
    elFileName.textContent = "《" + curBookName + "》" + (i + 1) + "/" + tracks.length + " · " + t.name;
    // 自动配对同名字幕
    cues = srtMap[t.base] || [];
    activeIdx = -1;
    renderSubtitles();
    tTotal.textContent = "00:00";
    if (cues.length) {
      showMsg("「" + t.base + "」已匹配同名字幕（" + cues.length + " 条）");
    } else if (Object.keys(srtMap).length) {
      showMsg("「" + t.base + "」没有同名/已选字幕，可点「换字幕」手动选");
    } else {
      showMsg("还没有选择字幕文件，可点「换字幕」选择");
    }
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: "听书播放器" });
      } catch (e) {}
    }
    audio.play();
    highlightPlaylist();
  }

  audio.addEventListener("ended", function () {
    saveProgress();
    if (curTrack < tracks.length - 1) {
      playTrack(curTrack + 1);
    } else {
      btnPlay.textContent = "▶";
      showMsg("播放列表已播完");
    }
  });

  // ---------- 播放列表 UI ----------
  function renderPlaylist() {
    plList.innerHTML = "";
    var frag = document.createDocumentFragment();
    tracks.forEach(function (t, i) {
      var div = document.createElement("div");
      div.className = "pl-item";
      div.innerHTML = '<span class="num">' + (i + 1) + '</span><span class="nm">' + (srtMap[t.base] ? "📄 " : "▫ ") + escapeHtml(t.name) + "</span>";
      div.addEventListener("click", function () {
        playTrack(i);
        plOverlay.classList.add("hidden");
      });
      frag.appendChild(div);
    });
    plList.appendChild(frag);
    highlightPlaylist();
  }

  function highlightPlaylist() {
    var items = plList.children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("current", i === curTrack);
    }
  }

  $("btn-list").addEventListener("click", function () {
    if (!tracks.length) { showMsg("播放列表为空"); return; }
    plOverlay.classList.remove("hidden");
    var cur = plList.children[curTrack];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "center" });
  });
  $("pl-close").addEventListener("click", function () { plOverlay.classList.add("hidden"); });
  plOverlay.addEventListener("click", function (e) {
    if (e.target === plOverlay) plOverlay.classList.add("hidden");
  });

  $("btn-books").addEventListener("click", function () {
    saveProgress();
    elPlayer.classList.add("hidden");
    elSetup.classList.remove("hidden");
    refreshBooks();
  });

  $("btn-srt").addEventListener("click", function () { inputSrt.click(); });
  inputSrt.addEventListener("change", function () {
    var files = Array.prototype.slice.call(inputSrt.files);
    if (!files.length) return;
    var pending = files.length, okCount = 0, matchedCur = false, pairCount = 0;
    var trackBases = {};
    tracks.forEach(function (t) { trackBases[t.base] = true; });
    files.forEach(function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        var content = decodeSubtitle(new Uint8Array(reader.result));
        var parsed = parseSrt(content);
        var base = f.name.replace(/\.[^.]+$/, "");
        if (parsed.length) {
          srtMap[base] = parsed;
          idbPut("srts", { base: base, text: content });
          okCount++;
          if (trackBases[base]) pairCount++;
          if (curTrack >= 0 && tracks[curTrack] && tracks[curTrack].base === base) {
            cues = parsed;
            activeIdx = -1;
            renderSubtitles();
            highlight(audio.currentTime || 0);
            matchedCur = true;
          }
        }
        if (--pending === 0) {
          renderPlaylist(); // 刷新列表里的 📄 配对标记
          if (okCount === 0) {
            showMsg("字幕解析失败：文件里没找到有效的时间轴");
          } else if (matchedCur) {
            showMsg("字幕已加载并配对当前曲目（" + cues.length + " 条），点击字幕可跳转");
          } else if (pairCount > 0) {
            showMsg("已加载 " + okCount + " 个字幕，其中 " + pairCount + " 个与音频同名配对成功");
          } else {
            showMsg("已加载 " + okCount + " 个字幕，但没有一个和音频文件同名，可到「☰ 列表」确认");
          }
        }
      };
      reader.onerror = function () {
        if (--pending === 0) showMsg("部分字幕读取失败");
      };
      reader.readAsArrayBuffer(f);
    });
  });

  // ---------- 播放控制 ----------
  btnPlay.addEventListener("click", function () {
    if (!audio.src) return;
    audio.paused ? audio.play() : audio.pause();
  });
  audio.addEventListener("play", function () { btnPlay.textContent = "⏸"; });
  audio.addEventListener("pause", function () { btnPlay.textContent = "▶"; saveProgress(); });

  $("btn-back").addEventListener("click", function () { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  $("btn-fwd").addEventListener("click", function () { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); });

  speedSel.addEventListener("change", function () {
    audio.playbackRate = parseFloat(speedSel.value);
    saveSettings();
  });
  // 恢复上次的倍速设置
  try {
    var savedSpeed = localStorage.getItem("tl_speed");
    if (savedSpeed && parseFloat(savedSpeed) > 0) {
      speedSel.value = savedSpeed;
      audio.playbackRate = parseFloat(savedSpeed);
    }
  } catch (e) {}

  seek.addEventListener("input", function () {
    if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
  });

  audio.addEventListener("timeupdate", function () {
    if (audio.duration) {
      seek.value = audio.currentTime / audio.duration * 1000;
      seek.style.setProperty("--fill", (seek.value / 10) + "%");
    }
    tCur.textContent = fmt(audio.currentTime);
    if (cues.length) highlight(audio.currentTime);
    if (Date.now() - lastSaved > 3000) {
      saveProgress();
      lastSaved = Date.now();
    }
  });
  audio.addEventListener("loadedmetadata", function () {
    tTotal.textContent = fmt(audio.duration);
    // 恢复进度：快播完的视为已听完，从头开始
    if (pendingResume != null) {
      if (audio.duration && pendingResume > audio.duration - 5) {
        audio.currentTime = 0;
      } else {
        audio.currentTime = pendingResume;
        showMsg("已恢复上次进度 " + fmt(pendingResume));
      }
      pendingResume = null;
    }
  });
  audio.addEventListener("ended", function () { btnPlay.textContent = "▶"; });
  audio.addEventListener("error", function () {
    if (audio.src) showMsg("音频无法播放，可能是浏览器不支持该格式，建议用 mp3 / m4a / wav");
  });

  // 锁屏 / 通知栏控制（安卓 Chrome 支持）
  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", function () { audio.play(); });
    navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
    navigator.mediaSession.setActionHandler("seekbackward", function () { audio.currentTime -= 15; });
    navigator.mediaSession.setActionHandler("seekforward", function () { audio.currentTime += 15; });
  }

  // ---------- 定时关闭 ----------
  var sleepDeadline = 0, sleepTick = null;

  function updateSleepUI(remaining) {
    if (remaining <= 0) {
      sleepPill.classList.remove("show", "open", "warn");
      return;
    }
    sleepPill.classList.add("show");
    var mins = Math.floor(remaining / 60000);
    var secs = Math.floor(remaining % 60000 / 1000);
    spTime.textContent = "剩余 " + mins + ":" + (secs < 10 ? "0" : "") + secs;
    sleepPill.classList.toggle("warn", remaining < 60000);
  }

  // 点胶囊本体展开/收起 +5 和 取消 按钮，4 秒无操作自动收起
  var pillTimer = null;
  $("sp-toggle").addEventListener("click", function () {
    sleepPill.classList.toggle("open");
    clearTimeout(pillTimer);
    if (sleepPill.classList.contains("open")) {
      pillTimer = setTimeout(function () { sleepPill.classList.remove("open"); }, 4000);
    }
  });

  function startSleep(minutes) {
    stopSleep(true);
    sleepDeadline = Date.now() + minutes * 60000;
    sleepTick = setInterval(function () {
      var remaining = sleepDeadline - Date.now();
      if (remaining <= 0) {
        audio.pause();
        stopSleep();
        showMsg("⏰ 定时时间到，已暂停播放");
        return;
      }
      updateSleepUI(remaining);
    }, 500);
    updateSleepUI(minutes * 60000);
    showMsg("将在 " + minutes + " 分钟后暂停播放");
  }

  function stopSleep(silent) {
    clearInterval(sleepTick);
    sleepTick = null;
    sleepDeadline = 0;
    if (!silent) updateSleepUI(0);
  }

  btnSleep.addEventListener("click", function () {
    var ov = openSheet(
      '<div class="sheet-title">⏰ 定时关闭</div>' +
      '<div class="sheet-quick">' +
        [15, 30, 45, 60].map(function (m) {
          return '<button class="qchip" data-m="' + m + '">' + m + " 分钟</button>";
        }).join("") +
      "</div>" +
      '<input class="sheet-input" id="sinput" type="number" inputmode="numeric" placeholder="或输入自定义分钟数" value="30">' +
      '<div class="sheet-actions">' +
        '<button class="sheet-btn" id="scancel">取消</button>' +
        '<button class="sheet-btn primary" id="sstart">开始</button>' +
      "</div>"
    );
    function pick(m) {
      ov.close();
      startSleep(m);
    }
    ov.querySelectorAll(".qchip").forEach(function (b) {
      b.addEventListener("click", function () { pick(parseInt(b.dataset.m, 10)); });
    });
    ov.querySelector("#sstart").addEventListener("click", function () {
      var n = parseFloat(ov.querySelector("#sinput").value);
      if (!isFinite(n) || n <= 0) { showMsg("请输入有效的分钟数"); return; }
      pick(Math.round(n));
    });
    ov.querySelector("#scancel").addEventListener("click", function () { ov.close(); });
  });
  btnSleepAdd.addEventListener("click", function () {
    if (!sleepDeadline) return;
    sleepDeadline += 5 * 60000;
    showMsg("已加时 5 分钟");
  });
  btnSleepCancel.addEventListener("click", function () {
    stopSleep();
    showMsg("已取消定时关闭");
  });
})();
</script>
</body>
</html>

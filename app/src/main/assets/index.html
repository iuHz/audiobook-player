<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#141418">
<title>听书播放器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg0: #07080B;            /* deepest, desktop outer */
    --bg: #0B0D12;             /* app base */
    --panel: #12151C;          /* raised surface */
    --panel-2: #1A1E27;        /* higher surface */
    --panel-3: #242A36;        /* hover / pressed */
    --line: rgba(255,255,255,.07);
    --line-2: rgba(255,255,255,.16);
    --ink: #F2EFE6;            /* primary text, warm off-white */
    --ink-2: #B8B3A8;          /* secondary */
    --ink-3: #7E7B72;          /* tertiary */
    --amber: #E2AE5C;          /* single accent: moonlight amber */
    --amber-hi: #F2CA85;
    --amber-soft: rgba(226,174,92,.16);
    --amber-softer: rgba(226,174,92,.07);
    --danger: #E46962;
    --danger-soft: rgba(228,105,98,.14);
    --r-sm: 10px; --r-md: 14px; --r-lg: 20px;
    --shadow-1: 0 6px 18px rgba(0,0,0,.35);
    --shadow-2: 0 12px 34px rgba(0,0,0,.45);
    --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
    --num: "SF Mono", ui-monospace, "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 70% at 50% -20%, #161A23 0%, var(--bg) 48%, var(--bg0) 100%);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  /* ---------- 页面容器 ---------- */
  .screen {
    position: absolute; top: 0; bottom: 0; left: 0; right: 0;
    margin: 0 auto; max-width: 680px;
    display: flex; flex-direction: column; min-height: 0;
  }

  /* ================= 书架 ================= */
  .shelf-head {
    flex-shrink: 0;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 12px;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 20px 12px;
  }
  .shelf-titles { min-width: 0; }
  .shelf-title {
    font-size: 27px; font-weight: 800; letter-spacing: .01em;
    line-height: 1.15; color: var(--ink);
  }
  .shelf-title em { font-style: normal; color: var(--amber-hi); }
  .shelf-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; line-height: 1.5; }
  #shelf-list-scroll { flex: 1; overflow-y: auto; min-height: 0; padding: 6px 16px 28px; -webkit-overflow-scrolling: touch; }
  .shelf-list {
    display: flex; flex-direction: column; gap: 12px;
    max-width: 560px; margin: 0 auto;
  }

  .book-card {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    padding: 13px 14px 13px 12px;
    border-radius: var(--r-lg);
    background: linear-gradient(180deg, var(--panel) 0%, rgba(18,21,28,.55) 100%);
    border: 1px solid var(--line);
    cursor: pointer;
    -webkit-touch-callout: none; user-select: none;
    transition: transform .12s ease, border-color .2s ease, background .2s ease;
    overflow: hidden;
  }
  .book-card:active { transform: scale(.985); }
  .book-card.current {
    border-color: rgba(226,174,92,.42);
    background: linear-gradient(180deg, rgba(226,174,92,.09) 0%, var(--panel) 100%);
  }
  .book-card .cover {
    flex-shrink: 0; width: 58px; height: 58px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 6px 14px rgba(0,0,0,.3);
    position: relative; overflow: hidden;
  }
  .book-card .cover::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(90% 60% at 30% 8%, rgba(255,255,255,.16), transparent 60%);
    pointer-events: none;
  }
  .book-card .cover b {
    font-size: 26px; font-weight: 700; color: rgba(255,250,240,.96);
    text-shadow: 0 1px 2px rgba(0,0,0,.3);
    letter-spacing: 0;
  }
  .book-card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
  .book-card .nm {
    font-size: 16px; font-weight: 650; color: var(--ink);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .book-card .meta {
    display: flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .book-card .meta .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); flex-shrink: 0; }
  .book-card .meta .dot.live { background: var(--amber); box-shadow: 0 0 0 3px var(--amber-soft); }
  .book-card .prog {
    height: 3px; border-radius: 2px; background: var(--panel-3);
    overflow: hidden; width: 100%;
  }
  .book-card .prog i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--amber), var(--amber-hi)); }
  .book-card .live-tag {
    position: absolute; top: 10px; right: 12px;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--amber-hi);
    background: var(--amber-soft); border: 1px solid rgba(226,174,92,.28);
    padding: 3px 9px; border-radius: 999px;
  }
  .book-card .live-tag i {
    width: 6px; height: 6px; border-radius: 50%; background: var(--amber);
    animation: livePulse 1.4s ease-in-out infinite;
  }
  @keyframes livePulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .empty-state {
    display: flex; flex-direction: column; align-items: center;
    text-align: center; gap: 6px;
    padding: 84px 28px 40px;
    max-width: 420px; margin: 0 auto;
  }
  .empty-state .es-ic {
    width: 76px; height: 76px; border-radius: 26px;
    background: var(--amber-softer); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--amber); margin-bottom: 12px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.05);
  }
  .empty-state .es-ic svg { width: 34px; height: 34px; }
  .empty-state .es-t { font-size: 18px; font-weight: 700; color: var(--ink); }
  .empty-state .es-d { font-size: 13.5px; color: var(--ink-3); line-height: 1.8; margin-bottom: 20px; }

  /* ================= 按钮体系 ================= */
  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; cursor: pointer;
    font-size: 14.5px; font-weight: 700; color: #241A08;
    background: linear-gradient(180deg, var(--amber-hi) 0%, var(--amber) 100%);
    border-radius: 999px;
    padding: 11px 18px;
    box-shadow: 0 8px 20px -6px rgba(226,174,92,.5), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .12s ease, box-shadow .2s ease;
    flex-shrink: 0;
  }
  .btn-primary:active { transform: scale(.97); }
  .btn-primary svg { width: 18px; height: 18px; }
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--ink-2);
    background: var(--panel-2); border: 1px solid var(--line-2);
    border-radius: 999px; padding: 10px 18px;
    transition: background .15s ease, color .15s ease, transform .12s ease;
  }
  .btn-ghost:active { transform: scale(.97); background: var(--panel-3); color: var(--ink); }

  /* ================= 播放器 ================= */
  .ply-head {
    flex-shrink: 0;
    display: grid; grid-template-columns: 44px 1fr 44px;
    align-items: center; gap: 6px;
    padding: calc(8px + env(safe-area-inset-top, 0px)) 14px 4px;
  }
  .icon-btn {
    width: 44px; height: 44px; border: none; border-radius: 999px;
    background: transparent; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:active { background: var(--panel-3); color: var(--ink); }
  .ply-meta { min-width: 0; text-align: center; display: flex; flex-direction: column; gap: 1px; }
  .ply-meta .ply-book {
    font-size: 11px; color: var(--ink-3); font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ply-meta .ply-file {
    font-size: 14px; font-weight: 650; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- 字幕（transcript） ---------- */
  .transcript {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 14px 18px 26px;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
  }
  .cue {
    max-width: 600px; margin: 0 auto 9px;
    padding: 12px 16px;
    font-size: 16.5px; line-height: 1.85;
    border-radius: var(--r-md);
    border-left: 3px solid transparent;
    background: transparent;
    color: var(--ink-3);
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .12s ease;
  }
  .cue:active { background: var(--panel-2); }
  .cue.active {
    background: linear-gradient(90deg, var(--amber-soft) 0%, var(--amber-softer) 100%);
    border-left-color: var(--amber);
    color: var(--ink);
    font-weight: 550;
  }
  .cue-hint {
    max-width: 560px; margin: 30px auto 0;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center; padding: 30px 24px;
    border: 1px dashed var(--line-2); border-radius: var(--r-lg);
  }
  .cue-hint .ch-ic {
    width: 54px; height: 54px; border-radius: 18px;
    background: var(--amber-softer); color: var(--amber);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 4px;
  }
  .cue-hint .ch-ic svg { width: 26px; height: 26px; }
  .cue-hint .ch-t { font-size: 15.5px; font-weight: 650; color: var(--ink-2); }
  .cue-hint .ch-d { font-size: 13px; color: var(--ink-3); line-height: 1.7; margin-bottom: 6px; }

  /* ---------- 底部控制台 ---------- */
  .dock {
    flex-shrink: 0;
    background: linear-gradient(180deg, rgba(11,13,18,.72) 0%, var(--bg) 26%);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    padding: 2px 20px calc(12px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--line);
  }
  .dock-in { max-width: 600px; margin: 0 auto; }

  #seek {
    width: 100%; height: 30px;
    -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer; display: block;
    margin: 0;
  }
  #seek::-webkit-slider-runnable-track {
    height: 5px; border-radius: 3px;
    background: linear-gradient(to right, var(--amber) var(--fill, 0%), var(--panel-3) var(--fill, 0%));
  }
  #seek::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--ink);
    margin-top: -6.5px;
    border: none;
    box-shadow: 0 1px 5px rgba(0,0,0,.5);
    transition: transform .12s ease;
  }
  #seek:active::-webkit-slider-thumb { transform: scale(1.15); }
  #seek::-moz-range-track { height: 5px; border-radius: 3px; background: var(--panel-3); }
  #seek::-moz-range-progress { height: 5px; border-radius: 3px; background: var(--amber); }
  #seek::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); border: none; }
  .time-row {
    display: flex; justify-content: space-between;
    margin: -4px 2px 0;
    font-size: 12px; color: var(--ink-3);
    font-family: var(--num);
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }

  .transport {
    display: flex; align-items: center; justify-content: center;
    gap: 20px; padding: 10px 0 4px;
  }
  .tbtn {
    border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--ink-2);
    transition: transform .12s ease, color .15s ease, background .15s ease;
    -webkit-touch-callout: none; user-select: none;
  }
  .tbtn.side {
    width: 60px; height: 60px; border-radius: 999px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    gap: 1px;
  }
  .tbtn.side svg { width: 21px; height: 21px; }
  .tbtn.side .lbl { font-size: 9.5px; font-weight: 600; color: var(--ink-3); letter-spacing: .04em; }
  .tbtn.side:active { transform: scale(.93); background: var(--panel-3); color: var(--ink); }
  .tbtn.main {
    width: 76px; height: 76px; border-radius: 999px;
    background: linear-gradient(180deg, var(--amber-hi) 0%, var(--amber) 100%);
    color: #241A08;
    box-shadow: 0 12px 26px -8px rgba(226,174,92,.55), inset 0 1px 0 rgba(255,255,255,.4);
  }
  .tbtn.main:active { transform: scale(.95); }
  .tbtn.main svg { width: 30px; height: 30px; }
  #btn-play svg.i-pause { display: none; }
  #btn-play.is-playing svg.i-play { display: none; }
  #btn-play.is-playing svg.i-pause { display: block; }

  .tool-row {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; padding: 10px 0 2px;
  }
  .tool {
    position: relative;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 40px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--panel-2); color: var(--ink-2);
    font-size: 13.5px; font-weight: 600;
    cursor: pointer; -webkit-appearance: none; appearance: none;
    transition: background .15s ease, color .15s ease, border-color .2s ease;
  }
  .tool svg { width: 17px; height: 17px; }
  .tool:active { background: var(--panel-3); color: var(--ink); }
  .tool.on { color: var(--amber-hi); border-color: rgba(226,174,92,.4); background: var(--amber-soft); }
  select.tool {
    padding: 0 30px 0 8px;
    text-align: center;
    text-align-last: center;
    background: transparent;
  }
  select.tool option { background: var(--panel-2); color: var(--ink); }
  .sel-wrap { position: relative; display: flex; align-items: center; }
  .sel-wrap select.tool { width: 100%; height: 100%; border: none; border-radius: 0; background: transparent; color: var(--ink-2); font-size: 13.5px; font-weight: 600; padding: 0 30px 0 8px; }
  .sel-wrap::after {
    content: ""; position: absolute; right: 15px; top: 50%;
    width: 7px; height: 7px; margin-top: -5px;
    border-right: 1.6px solid var(--ink-3);
    border-bottom: 1.6px solid var(--ink-3);
    transform: rotate(45deg);
    pointer-events: none;
  }

  /* ---------- 悬浮：睡眠胶囊 ---------- */
  #sleep-pill {
    position: fixed; top: calc(58px + env(safe-area-inset-top, 0px)); right: 12px;
    z-index: 60;
    display: none; align-items: center;
    gap: 2px;
    background: rgba(18,21,28,.92);
    border: 1px solid var(--line-2);
    border-radius: 999px;
    padding: 5px;
    font-size: 12.5px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: var(--shadow-1);
    font-variant-numeric: tabular-nums;
    max-width: calc(100vw - 24px);
  }
  #sleep-pill.show { display: flex; }
  #sleep-pill.warn { border-color: rgba(228,105,98,.45); }
  .pill-main {
    display: flex; align-items: center; gap: 7px;
    border: none; background: transparent; color: var(--ink-2);
    font-size: 12.5px; font-weight: 600;
    padding: 5px 8px; border-radius: 999px; cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .pill-main svg { width: 16px; height: 16px; color: var(--amber); }
  #sleep-pill.warn .pill-main svg, #sleep-pill.warn #sp-time { color: var(--danger); }
  .pill-main .chev { width: 11px !important; height: 11px !important; color: var(--ink-3) !important; }
  .pill-btn {
    display: none; border: none; cursor: pointer;
    font-size: 12.5px; font-weight: 600;
    padding: 6px 11px; border-radius: 999px;
    color: var(--ink-2); background: var(--panel-3);
    transition: transform .12s ease;
  }
  .pill-btn:active { transform: scale(.94); }
  #sleep-pill.open .pill-btn { display: inline-block; }
  .pill-btn.danger { color: var(--danger); }

  /* ---------- 悬浮：回到当前 ---------- */
  #back-to-cur {
    position: fixed;
    left: 14px;
    bottom: calc(206px + env(safe-area-inset-bottom, 0px));
    z-index: 80;
    display: none;
    align-items: center; gap: 6px;
    border: none;
    border-radius: 999px;
    padding: 9px 14px;
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    color: var(--ink-2);
    font-size: 13px; font-weight: 600;
    box-shadow: var(--shadow-1);
    cursor: pointer;
  }
  #back-to-cur svg { width: 15px; height: 15px; }
  #back-to-cur.show { display: flex; }

  /* ================= 底部弹层 ================= */
  .sheet-overlay, #pl-overlay {
    position: fixed; inset: 0;
    background: rgba(4,5,8,.62);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 70;
    display: flex; align-items: flex-end;
    animation: fadeIn .18s ease;
  }
  #pl-overlay.hidden { display: none; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    background: linear-gradient(180deg, #171B23 0%, #10131A 100%);
    width: 100%; max-width: 680px;
    margin: 0 auto;
    border-radius: 26px 26px 0 0;
    border-top: 1px solid var(--line-2);
    padding: 8px 18px calc(16px + env(safe-area-inset-bottom, 0px));
    max-height: 74vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    animation: sheetUp .26s cubic-bezier(.2,.8,.25,1);
  }
  @keyframes sheetUp { from { transform: translateY(46px); opacity: .4; } to { transform: translateY(0); opacity: 1; } }
  .handle { width: 42px; height: 4.5px; border-radius: 3px; background: var(--panel-3); margin: 2px auto 10px; flex-shrink: 0; }
  .sheet-title { font-size: 17px; font-weight: 750; text-align: center; color: var(--ink); padding: 4px 0 10px; }
  .sheet-title .sc { display: block; font-size: 12px; font-weight: 500; color: var(--ink-3); margin-top: 4px; }

  .sheet-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    border-radius: var(--r-md);
    font-size: 15.5px; font-weight: 550; color: var(--ink);
    cursor: pointer;
    margin-top: 6px;
    background: transparent;
    transition: background .15s ease;
  }
  .sheet-item:active { background: var(--panel-2); }
  .sheet-item + .sheet-item { margin-top: 2px; }
  .sheet-item .ic {
    flex-shrink: 0; width: 36px; height: 36px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-3); color: var(--ink-2);
  }
  .sheet-item .ic svg { width: 18px; height: 18px; }
  .sheet-item .lbl { flex: 1; text-align: left; }
  .sheet-item.danger .ic { background: var(--danger-soft); color: var(--danger); }
  .sheet-item.danger .lbl { color: var(--danger); }
  .sheet-note {
    font-size: 13px; color: var(--ink-3); line-height: 1.7;
    padding: 10px 4px 2px; text-align: center;
  }
  .sheet-input {
    width: 100%; margin-top: 10px;
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: var(--r-md);
    color: var(--ink);
    font-size: 16px; font-weight: 500;
    padding: 13px 15px;
    outline: none;
    transition: border-color .2s ease;
  }
  .sheet-input:focus { border-color: var(--amber); }
  .sheet-input::placeholder { color: var(--ink-3); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
  .sheet-btn {
    flex: 1; padding: 14px;
    border: none; border-radius: var(--r-md);
    font-size: 15.5px; font-weight: 650;
    cursor: pointer;
    background: var(--panel-2); color: var(--ink-2);
    transition: transform .12s ease, background .15s ease;
  }
  .sheet-btn:active { transform: scale(.98); background: var(--panel-3); }
  .sheet-btn.primary {
    background: linear-gradient(180deg, var(--amber-hi), var(--amber));
    color: #241A08; font-weight: 750;
    box-shadow: 0 8px 18px -8px rgba(226,174,92,.5);
  }
  .sheet-btn.danger { background: var(--danger-soft); color: var(--danger); }
  .sheet-quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 4px; }
  .qchip {
    padding: 13px 0 11px;
    border-radius: var(--r-md);
    border: 1px solid var(--line);
    background: var(--panel-2); color: var(--ink-2);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    font-variant-numeric: tabular-nums;
    transition: transform .12s ease, border-color .15s ease, background .15s ease;
  }
  .qchip:active { transform: scale(.96); background: var(--panel-3); }
  .qchip b { display: block; font-size: 19px; font-weight: 750; color: var(--ink); margin-bottom: 1px; }

  /* ---------- 播放列表弹层 ---------- */
  #pl-panel { display: flex; flex-direction: column; padding: 8px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .pl-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 6px 10px;
  }
  .pl-title { font-size: 16px; font-weight: 750; color: var(--ink); display: flex; align-items: center; gap: 8px; }
  .pl-count { font-size: 12px; font-weight: 600; color: var(--ink-3); font-family: var(--num); }
  .pl-x {
    width: 36px; height: 36px; border-radius: 999px; border: none;
    background: var(--panel-2); color: var(--ink-2);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .pl-x:active { background: var(--panel-3); color: var(--ink); }
  .pl-x svg { width: 15px; height: 15px; }
  #pl-list { overflow-y: auto; padding: 2px 2px 8px; }
  .pl-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 12px;
    border-radius: var(--r-md);
    font-size: 14.5px; font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    line-height: 1.4;
    transition: background .15s ease, color .15s ease;
    margin-bottom: 2px;
  }
  .pl-item:active { background: var(--panel-2); }
  .pl-item .num {
    flex-shrink: 0; width: 26px; text-align: right;
    font-family: var(--num); font-size: 12.5px; color: var(--ink-3);
  }
  .pl-item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-item .tag {
    flex-shrink: 0; font-size: 10.5px; font-weight: 650; color: var(--amber-hi);
    background: var(--amber-soft); border: 1px solid rgba(226,174,92,.25);
    padding: 2px 7px; border-radius: 999px;
  }
  .pl-item .eq {
    flex-shrink: 0; display: flex; align-items: flex-end; gap: 2px; height: 14px;
    opacity: 0;
  }
  .pl-item.current { background: var(--amber-soft); color: var(--ink); font-weight: 600; }
  .pl-item.current .eq { opacity: 1; }
  .pl-item .eq i {
    width: 3px; background: var(--amber); border-radius: 2px;
    animation: eqB 1s ease-in-out infinite;
  }
  .pl-item .eq i:nth-child(1) { height: 8px; animation-delay: 0s; }
  .pl-item .eq i:nth-child(2) { height: 13px; animation-delay: .18s; }
  .pl-item .eq i:nth-child(3) { height: 6px; animation-delay: .36s; }
  @keyframes eqB { 0%,100% { transform: scaleY(.6); } 50% { transform: scaleY(1); } }

  /* ---------- toast ---------- */
  #msg {
    position: fixed; left: 50%;
    transform: translateX(-50%);
    background: rgba(26,30,39,.96);
    border: 1px solid var(--line-2);
    color: var(--ink);
    font-size: 13.5px; font-weight: 500;
    line-height: 1.6;
    padding: 10px 16px;
    border-radius: 999px;
    max-width: 86vw;
    text-align: center;
    z-index: 120;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
    box-shadow: var(--shadow-1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  #msg.show { opacity: 1; }

  /* ---------- 图标基础 ---------- */
  svg { display: block; flex-shrink: 0; }
  .icon-btn svg { width: 21px; height: 21px; }

  /* ---------- 无障碍 / 动效偏好 ---------- */
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .transcript { scroll-behavior: auto; }
  }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-3); border-radius: 4px; }

</style>
</head>
<body>

<!-- 书架 -->
<section id="setup" class="screen">
  <header class="shelf-head">
    <div class="shelf-titles">
      <div class="shelf-title">我的<em>书架</em></div>
      <div class="shelf-sub">长按书单可重命名或删除 · 进度自动记忆</div>
    </div>
    <button type="button" class="btn-primary" id="btn-pick">

      新建书单

  </header>
  <div id="shelf-list-scroll">
    <div id="book-list" class="shelf-list"></div>
  </div>
</section>

<!-- 播放器 -->
<section id="player" class="screen hidden">
  <header class="ply-head">
    <button type="button" class="icon-btn" id="btn-books" aria-label="返回书架">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="ply-meta">
      <div class="ply-book" id="ply-book"></div>
      <div class="ply-file" id="file-name">未选择文件</div>
    </div>
    <button type="button" class="icon-btn" id="btn-list" aria-label="本集列表">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.2 6h.01M4.2 12h.01M4.2 18h.01" stroke-width="2.8"/></svg>
    </button>
  </header>

  <div id="subtitle-list" class="transcript"></div>

  <div id="controls" class="dock">
    <div class="dock-in">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="播放进度">
      <div class="time-row">
        <span id="t-cur">00:00</span>
        <span id="t-total">00:00</span>
      </div>

      <div class="transport">
        <button type="button" class="tbtn side" id="btn-back" aria-label="后退 15 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          <span class="lbl">15秒</span>
        </button>
        <button type="button" class="tbtn main" id="btn-play" aria-label="播放 / 暂停">
          <svg class="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.14v13.72a.7.7 0 0 0 1.06.6l11.1-6.86a.7.7 0 0 0 0-1.2L9.06 4.54A.7.7 0 0 0 8 5.14z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path fill="currentColor" d="M7.2 5h3.3v14H7.2zM13.5 5h3.3v14h-3.3z"/></svg>
        </button>
        <button type="button" class="tbtn side" id="btn-fwd" aria-label="前进 15 秒">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/></svg>
          <span class="lbl">15秒</span>
        </button>
      </div>

      <div class="tool-row">
        <button type="button" class="tool" id="btn-srt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.8h8.2L18.2 7v13.4a.8.8 0 0 1-.8.8H6a.8.8 0 0 1-.8-.8V3.6a.8.8 0 0 1 .8-.8z"/><path d="M13.6 2.9v4.4h4.5M9 12.5h6M9 16h4"/></svg>
          <span>字幕</span>
        </button>
        <div class="sel-wrap tool">
          <select id="speed" title="倍速" aria-label="播放倍速">
            <option value="0.5">0.5x 慢速</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x 正常</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2.0x</option>
          </select>
        </div>
        <button type="button" class="tool" id="btn-sleep">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
          <span>定时</span>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- 定时关闭悬浮胶囊 -->
<div id="sleep-pill">
  <button type="button" class="pill-main" id="sp-toggle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
    <span id="sp-time">剩余 30:00</span>
    <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <button type="button" class="pill-btn" id="btn-sleep-add">+5 分钟</button>
  <button type="button" class="pill-btn danger" id="btn-sleep-cancel">取消</button>
</div>

<!-- 回到当前字幕 -->
<button type="button" id="back-to-cur">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h6M15 12h6M12 3v6M12 15v6"/><circle cx="12" cy="12" r="2.2"/></svg>
  <span>回到当前</span>
</button>

<!-- 播放列表弹层 -->
<div id="pl-overlay" class="hidden">
  <div class="sheet" id="pl-panel">
    <div class="handle"></div>
    <div class="pl-head">
      <span class="pl-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.2 6h.01M4.2 12h.01M4.2 18h.01" stroke-width="2.8"/></svg>
        播放列表
      </span>
      <span class="pl-count" id="pl-count"></span>
      <button type="button" class="pl-x" id="pl-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="pl-list"></div>
  </div>
</div>

<div id="msg" role="status"></div>

<!-- 隐藏的文件选择器 -->
<input type="file" id="input-audio" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple hidden>
<input type="file" id="input-srt" multiple hidden>

<script>
(function () {
  "use strict";

  // ---------- 状态 ----------
  var cues = [];            // [{start, end, text}]
  var activeIdx = -1;
  var scrollPending = false;

  // ---------- DOM ----------
  var $ = function (id) { return document.getElementById(id); };
  var elSetup = $("setup"), elPlayer = $("player");
  var elFileName = $("file-name"), elPlyBook = $("ply-book");
  var btnPick = $("btn-pick");
  var inputAudio = $("input-audio"), inputSrt = $("input-srt");
  var list = $("subtitle-list");
  var audio = new Audio();
  audio.preload = "metadata";

  var btnPlay = $("btn-play"), seek = $("seek");
  var tCur = $("t-cur"), tTotal = $("t-total");
  var speedSel = $("speed");
  var btnSleep = $("btn-sleep"), sleepPill = $("sleep-pill"), spTime = $("sp-time");
  var btnSleepAdd = $("btn-sleep-add"), btnSleepCancel = $("btn-sleep-cancel");

  // ---------- 工具 ----------
  var msgTimer = null;

  var SVG = {
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M10 11v6M14 11v6"/></svg>',
    doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.8h8.2L18.2 7v13.4a.8.8 0 0 1-.8.8H6a.8.8 0 0 1-.8-.8V3.6a.8.8 0 0 1 .8-.8z"/><path d="M13.6 2.9v4.4h4.5M9 12.5h6M9 16h4"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.4C10.6 5 8.5 4.3 5.6 4.3c-.7 0-1.4.1-1.4.4v13.2c0 .3.7.4 1.4.4 2.9 0 5 .7 6.4 2.1 1.4-1.4 3.5-2.1 6.4-2.1.7 0 1.4-.1 1.4-.4V4.7c0-.3-.7-.4-1.4-.4-2.9 0-5 .7-6.4 2.1z"/><path d="M12 6.4v13.8"/></svg>'
  };

  function setPlayBtn(on) { btnPlay.classList.toggle("is-playing", !!on); }
  function showMsg(text, ms) {
    var m = $("msg");
    m.textContent = text;
    m.classList.add("show");
    var dock = $("controls"), base = 24;
    if (dock && dock.offsetParent !== null) {
      var r = dock.getBoundingClientRect();
      base = Math.max(24, window.innerHeight - r.top + 10);
    }
    m.style.bottom = base + "px";
    clearTimeout(msgTimer);
    msgTimer = setTimeout(function () { m.classList.remove("show"); }, ms || 2600);
  }

  // ---------- 通用底部弹层 ----------
  function openSheet(html) {
    var ov = document.createElement("div");
    ov.className = "sheet-overlay";
    ov.innerHTML = '<div class="sheet"><div class="handle"></div>' + html + "</div>";
    document.body.appendChild(ov);
    ov.addEventListener("click", function (e) {
      if (e.target === ov) ov.close();
    });
    ov.close = function () { ov.remove(); };
    return ov;
  }

  function nameSheet(title, defVal, cb) {
    var ov = openSheet(
      '<div class="sheet-title">' + title + "</div>" +
      '<input class="sheet-input" id="ninput" value="' + escapeHtml(defVal) + '">' +
      '<div class="sheet-actions">' +
        '<button class="sheet-btn" id="ncancel">取消</button>' +
        '<button class="sheet-btn primary" id="nok">确定</button>' +
      "</div>"
    );
    var input = ov.querySelector("#ninput");
    setTimeout(function () { input.focus(); }, 120);
    function done() {
      var v = input.value.trim();
      ov.close();
      cb(v || null);
    }
    ov.querySelector("#nok").addEventListener("click", done);
    ov.querySelector("#ncancel").addEventListener("click", function () { ov.close(); cb(null); });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") done(); });
  }

  function fmt(t) {
    if (!isFinite(t) || t < 0) t = 0;
    var h = Math.floor(t / 3600),
        m = Math.floor(t % 3600 / 60),
        s = Math.floor(t % 60);
    var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
    return h > 0 ? h + ":" + mm + ":" + ss : mm + ":" + ss;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---------- 字幕解析（SRT / VTT，支持 UTF-8 与 GBK 自动识别） ----------
  function parseTimestamp(line) {
    var m = line.match(/(\d{1,2}):(\d{1,2}):(\d{1,2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{1,2}):(\d{1,2})[,.](\d{1,3})/);
    if (!m) m = line.match(/(\d{1,2}):(\d{1,2})[,.](\d{1,3})\s*-->\s*(\d{1,2}):(\d{1,2})[,.](\d{1,3})/);
    if (!m) return null;
    var g = m.map(Number);
    if (m.length === 9) {
      return { start: g[1] * 3600 + g[2] * 60 + g[3] + g[4] / 1000,
               end:   g[5] * 3600 + g[6] * 60 + g[7] + g[8] / 1000 };
    }
    return { start: g[1] * 60 + g[2] + g[3] / 1000,
             end:   g[4] * 60 + g[5] + g[6] / 1000 };
  }

  function decodeSubtitle(buffer) {
    // 先按 UTF-8 严格解码，失败则回退 GBK（很多老字幕是 GBK 编码）
    try {
      return new TextDecoder("utf-8", { fatal: true }).decode(buffer);
    } catch (e) {
      try { return new TextDecoder("gbk").decode(buffer); }
      catch (e2) { return new TextDecoder("utf-8").decode(buffer); }
    }
  }

  function parseSrt(content) {
    var lines = content.replace(/\r\n?/g, "\n").replace(/^\uFEFF/, "").split("\n");
    var out = [], cur = null;
    for (var i = 0; i < lines.length; i++) {
      var ts = parseTimestamp(lines[i]);
      if (ts) {
        if (cur) out.push(cur);
        cur = { start: ts.start, end: ts.end, text: "" };
        continue;
      }
      if (cur) {
        var line = lines[i].trim();
        if (!line) { if (cur.text) { out.push(cur); cur = null; } continue; }
        if (/^\d+$/.test(line) && !cur.text) continue; // 序号行
        cur.text += (cur.text ? "\n" : "") + line;
      }
    }
    if (cur && cur.text) out.push(cur);
    return out.filter(function (c) { return c.end > c.start || c.end === 0; });
  }

  // ---------- 字幕渲染 ----------
  function renderSubtitles() {
    list.innerHTML = "";
    if (!cues.length) {
      if (audio.getAttribute("src")) {
        var h = document.createElement("div");
        h.className = "cue-hint";
        h.innerHTML = '<div class="ch-ic">' + SVG.doc + "</div>" +
          '<div class="ch-t">暂无字幕</div>' +
          '<div class="ch-d">选择与音频同名的 .srt 文件，<br>即可点任意句子跳转播放。</div>' +
          '<button type="button" class="btn-ghost" id="btn-srt-empty">选择字幕文件</button>';
        list.appendChild(h);
        var be = h.querySelector("#btn-srt-empty");
        if (be) be.addEventListener("click", function () { inputSrt.click(); });
      }
      return;
    }
    var frag = document.createDocumentFragment();
    cues.forEach(function (c, i) {
      var div = document.createElement("div");
      div.className = "cue";
      div.dataset.idx = i;
      div.innerHTML = escapeHtml(c.text).replace(/\n/g, "<br>");
      div.addEventListener("click", function () {
        audio.currentTime = cues[i].start;
        if (audio.paused) audio.play();
        showMsg("跳转到 " + fmt(cues[i].start));
      });
      frag.appendChild(div);
    });
    list.appendChild(frag);
  }

  // ---------- 手动浏览检测：用户翻看时暂停自动滚动 8 秒 ----------
  var userBrowsingUntil = 0;
  var btnBackCur = $("back-to-cur");

  function userScrolling() { return Date.now() < userBrowsingUntil; }

  ["touchstart", "wheel", "mousedown"].forEach(function (ev) {
    list.addEventListener(ev, function () {
      userBrowsingUntil = Date.now() + 8000;
      updateBackBtn();
    }, { passive: true });
  });

  function updateBackBtn() {
    var a = list.querySelector(".cue.active");
    if (!a || !userScrolling()) {
      btnBackCur.classList.remove("show");
      return;
    }
    var r = a.getBoundingClientRect(), lr = list.getBoundingClientRect();
    var visible = r.bottom > lr.top && r.top < lr.bottom;
    btnBackCur.classList.toggle("show", !visible);
  }

  btnBackCur.addEventListener("click", function () {
    userBrowsingUntil = 0;
    var a = list.querySelector(".cue.active");
    if (a) {
      var top = a.offsetTop - list.clientHeight / 2 + a.clientHeight / 2;
      list.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
    }
    btnBackCur.classList.remove("show");
  });

  list.addEventListener("scroll", function () {
    if (scrollPending) return;
    updateBackBtn();
  }, { passive: true });

  function highlight(time) {
    var idx = -1;
    for (var i = 0; i < cues.length; i++) {
      if (time >= cues[i].start && time < (cues[i].end || cues[i].start + 5)) { idx = i; break; }
      if (cues[i].start > time) break;
    }
    // 没精确命中时，取最后一个已开始的
    if (idx === -1 && cues.length && time >= cues[0].start) {
      for (var j = cues.length - 1; j >= 0; j--) {
        if (cues[j].start <= time) { idx = j; break; }
      }
    }
    if (idx === activeIdx) return;
    var prev = list.querySelector(".cue.active");
    if (prev) prev.classList.remove("active");
    activeIdx = idx;
    if (idx >= 0) {
      var el = list.children[idx];
      if (el) {
        el.classList.add("active");
        if (!scrollPending && !userScrolling()) {
          scrollPending = true;
          setTimeout(function () {
            var a = list.querySelector(".cue.active");
            if (a && !userScrolling()) {
              var top = a.offsetTop - list.clientHeight / 2 + a.clientHeight / 2;
              list.scrollTo({ top: Math.max(0, top), behavior: "smooth" });
            }
            scrollPending = false;
            updateBackBtn();
          }, 80);
        } else {
          updateBackBtn();
        }
      }
    }
  }

  // ---------- 播放列表与音频加载 ----------
  var tracks = [];        // [{name, base, url, file}]
  var srtMap = {};        // 文件名(不含扩展名) -> 已解析字幕
  var curTrack = -1;
  var plOverlay = $("pl-overlay"), plList = $("pl-list");

  // ---------- 进度记忆（按文件名存到浏览器本地存储） ----------
  function saveKey(base) { return "tl_pos_" + base; }
  var lastSaved = 0, pendingResume = null;

  function saveProgress() {
    if (curTrack < 0 || !tracks[curTrack] || !isFinite(audio.currentTime)) return;
    try {
      localStorage.setItem(saveKey(tracks[curTrack].base), JSON.stringify({
        t: audio.currentTime,
        d: audio.duration || 0,
        ts: Date.now()
      }));
    } catch (e) {}
  }
  function saveSettings() {
    try { localStorage.setItem("tl_speed", speedSel.value); } catch (e) {}
  }
  // 切后台 / 关页面时也存一次
  window.addEventListener("pagehide", saveProgress);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") saveProgress();
  });

  // ---------- 内容库 v2：多书单（books → tracks 两级，旧数据自动迁移） ----------
  var db = null;
  var books = [];
  var bookCount = {};
  var allTracks = {};
  var curBookId = null;
  var curBookName = "";

  function openDB() {
    return new Promise(function (resolve) {
      try {
        var req = indexedDB.open("audiobook_player", 2);
        req.onupgradeneeded = function () {
          var d = req.result;
          var tx = req.transaction;
          if (!d.objectStoreNames.contains("books")) d.createObjectStore("books", { keyPath: "id" });
          if (d.objectStoreNames.contains("tracks")) {
            // v1 旧库：单列表结构 → 迁移为默认书单
            tx.objectStore("tracks").getAll().onsuccess = function (ev) {
              var oldTracks = ev.target.result || [];
              d.deleteObjectStore("tracks");
              var st = d.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
              st.createIndex("bookId", "bookId");
              oldTracks.forEach(function (t, i) {
                st.put({ bookId: 1, name: t.name, base: t.base, blob: t.blob, order: i });
              });
              tx.objectStore("books").put({ id: 1, name: "我的书单" });
            };
          } else {
            var st = d.createObjectStore("tracks", { keyPath: "id", autoIncrement: true });
            st.createIndex("bookId", "bookId");
          }
          if (!d.objectStoreNames.contains("srts")) d.createObjectStore("srts", { keyPath: "base" });
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { resolve(null); };
      } catch (e) { resolve(null); }
    });
  }
  function idbAll(store) {
    return new Promise(function (res) {
      if (!db) return res([]);
      try {
        db.transaction(store).objectStore(store).getAll().onsuccess = function (e) { res(e.target.result || []); };
      } catch (e) { res([]); }
    });
  }
  function idbPut(store, val) {
    return new Promise(function (res) {
      if (!db) return res();
      try {
        var t = db.transaction(store, "readwrite");
        t.objectStore(store).put(val);
        t.oncomplete = function () { res(); };
        t.onerror = function () { res(); };
      } catch (e) { res(); }
    });
  }

  function loadSrts() {
    return idbAll("srts").then(function (list) {
      srtMap = {};
      list.forEach(function (s) {
        var p = parseSrt(s.text);
        if (p.length) srtMap[s.base] = p;
      });
    });
  }

  function refreshBooks() {
    return idbAll("books").then(function (bs) {
      books = bs.sort(function (a, b) { return (a.id || 0) - (b.id || 0); });
      return idbAll("tracks");
    }).then(function (all) {
      bookCount = {};
      allTracks = {};
      all.forEach(function (t) {
        bookCount[t.bookId] = (bookCount[t.bookId] || 0) + 1;
        (allTracks[t.bookId] = allTracks[t.bookId] || []).push(t);
      });
      Object.keys(allTracks).forEach(function (k) {
        allTracks[k].sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      });
      renderBookList();
    });
  }

  var COVER_BG = [
    "linear-gradient(160deg,#3A4155 0%,#232838 100%)",
    "linear-gradient(160deg,#4A4250 0%,#2A2431 100%)",
    "linear-gradient(160deg,#3C4A43 0%,#232D28 100%)",
    "linear-gradient(160deg,#4A3E45 0%,#2A2226 100%)",
    "linear-gradient(160deg,#44463E 0%,#282A24 100%)"
  ];

  function renderBookList() {
    var el = $("book-list");
    el.innerHTML = "";
    if (!books.length) {
      el.innerHTML =
        '<div class="empty-state">' +
          '<div class="es-ic">' + SVG.book + "</div>" +
          '<p class="es-t">书架还是空的</p>' +
          '<p class="es-d">导入一本书的音频（可以一次多选几集），<br>同名的 .srt 字幕会自动配对。</p>' +
          '<button type="button" class="btn-primary" id="es-add">新建第一个书单</button>' +
        "</div>";
      var eb = $("es-add");
      if (eb) eb.addEventListener("click", function () { btnPick.click(); });
      return;
    }
    var frag = document.createDocumentFragment();
    books.forEach(function (b) {
      var card = document.createElement("div");
      card.className = "book-card" + (b.id === curBookId ? " current" : "");
      var cnt = bookCount[b.id] || 0;
      var posIdx = -1, pct = 0, posText = "共 " + cnt + " 集 · 还没开始听";
      try {
        var pos = JSON.parse(localStorage.getItem("tl_bookpos_" + b.id) || "null");
        if (pos && pos.i >= 0 && allTracks[b.id] && allTracks[b.id][pos.i]) {
          posIdx = pos.i;
          var t = allTracks[b.id][pos.i];
          var pr = JSON.parse(localStorage.getItem(saveKey(t.base)) || "null");
          pct = pr && pr.d ? Math.min(100, Math.round(pr.t / pr.d * 100)) : 0;
          posText = (posIdx + 1) + " / " + cnt + " 集" + (pct ? " · 已听 " + pct + "%" : "");
        }
      } catch (e) {}
      var ch = ((b.name || "").replace(/^\s+/, "").charAt(0) || "书");
      var ci = Math.abs((b.id || 0)) % COVER_BG.length;
      card.innerHTML =
        '<span class="cover" style="background:' + COVER_BG[ci] + '"><b>' + escapeHtml(ch) + "</b></span>" +
        '<span class="info">' +
          '<span class="nm">' + escapeHtml(b.name) + "</span>" +
          '<span class="meta"><i class="dot' + (b.id === curBookId ? " live" : "") + '"></i>' + posText + "</span>" +
          (pct > 0 ? '<span class="prog"><i style="width:' + pct + '%"></i></span>' : "") +
        "</span>" +
        (b.id === curBookId ? '<span class="live-tag"><i></i>播放中</span>' : "");
      var lpTimer = null, lpFired = false;
      card.addEventListener("click", function () {
        if (lpFired) { lpFired = false; return; }
        if (b.id === curBookId) {
          elSetup.classList.add("hidden");
          elPlayer.classList.remove("hidden");
        } else {
          saveProgress();
          openBook(b.id);
        }
      });
      // 长按 → 管理（重命名 / 删除）；桌面右键同样触发
      card.addEventListener("touchstart", function () {
        lpFired = false;
        lpTimer = setTimeout(function () { lpFired = true; bookManage(b); }, 550);
      }, { passive: true });
      card.addEventListener("touchend", function () { clearTimeout(lpTimer); });
      card.addEventListener("touchmove", function () { clearTimeout(lpTimer); }, { passive: true });
      card.addEventListener("contextmenu", function (e) { e.preventDefault(); bookManage(b); });
      frag.appendChild(card);
    });
    el.appendChild(frag);
  }

  // ---------- 书单管理（重命名 / 删除） ----------
  function bookManage(b) {
    var ov = openSheet(
      '<div class="sheet-title">' + escapeHtml(b.name) + "</div>" +
      '<div class="sheet-item"><span class="ic">' + SVG.pencil + "</span><span class='lbl'>重命名</span></div>" +
      '<div class="sheet-item danger"><span class="ic">' + SVG.trash + "</span><span class='lbl'>删除书单</span></div>"
    );
    var items = ov.querySelectorAll(".sheet-item");
    items[0].addEventListener("click", function () {
      ov.close();
      nameSheet("重命名书单", b.name, function (name) {
        if (!name) return;
        idbPut("books", { id: b.id, name: name }).then(refreshBooks);
        if (b.id === curBookId) curBookName = name;
        showMsg("已重命名");
      });
    });
    items[1].addEventListener("click", function () {
      ov.close();
      confirmDelete(b);
    });
  }

  function confirmDelete(b) {
    var ov = openSheet(
      '<div class="sheet-title">删除「' + escapeHtml(b.name) + '」？</div>' +
      '<div class="sheet-note">删除后，该书单里的所有音频与收听进度都会一并清除，无法恢复。</div>' +
      '<div class="sheet-actions">' +
        '<button class="sheet-btn" id="dcancel">再想想</button>' +
        '<button class="sheet-btn danger" id="dok">删除</button>' +
      "</div>"
    );
    ov.querySelector("#dok").addEventListener("click", function () {
      ov.close();
      deleteBook(b.id);
    });
    ov.querySelector("#dcancel").addEventListener("click", function () { ov.close(); });
  }

  function deleteBook(id) {
    idbAll("tracks").then(function (all) {
      var keys = all.filter(function (t) { return t.bookId === id; }).map(function (t) { return t.id; });
      return new Promise(function (res) {
        if (!db || !keys.length) return res();
        var tx = db.transaction("tracks", "readwrite");
        keys.forEach(function (k) { tx.objectStore("tracks").delete(k); });
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    }).then(function () {
      return new Promise(function (res) {
        if (!db) return res();
        var tx = db.transaction("books", "readwrite");
        tx.objectStore("books").delete(id);
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { res(); };
      });
    }).then(function () {
      if (curBookId === id) {
        curBookId = null; curBookName = ""; curTrack = -1; tracks = [];
        audio.pause();
        audio.removeAttribute("src");
        elPlayer.classList.add("hidden");
        elSetup.classList.remove("hidden");
      }
      try { localStorage.removeItem("tl_bookpos_" + id); } catch (e) {}
      refreshBooks();
      showMsg("书单已删除");
    });
  }

  function openBook(id) {
    return idbAll("tracks").then(function (all) {
      var rows = all.filter(function (t) { return t.bookId === id; })
                    .sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      if (!rows.length) { showMsg("这个书单是空的"); return; }
      tracks.forEach(function (t) { URL.revokeObjectURL(t.url); });
      tracks = rows.map(function (t) {
        return { name: t.name, base: t.base, url: URL.createObjectURL(t.blob), file: t.blob };
      });
      curBookId = id;
      for (var i = 0; i < books.length; i++) {
        if (books[i].id === id) curBookName = books[i].name;
      }
      try { localStorage.setItem("tl_lastbook", String(id)); } catch (e) {}
      curTrack = -1;
      elSetup.classList.add("hidden");
      elPlayer.classList.remove("hidden");
      renderPlaylist();
      // 恢复上次听到的那一集
      var startIdx = 0;
      try {
        var pos = JSON.parse(localStorage.getItem("tl_bookpos_" + id) || "null");
        if (pos && pos.i >= 0 && pos.i < tracks.length) startIdx = pos.i;
      } catch (e) {}
      playTrack(startIdx);
    });
  }

  // 启动：开库 → 载入字幕库 → 渲染书单
  openDB().then(function (d) {
    db = d;
    if (!db) { showMsg("本地存储不可用，文件无法保存"); return; }
    loadSrts().then(refreshBooks);
  });

  btnPick.addEventListener("click", function () { inputAudio.click(); });
  inputAudio.addEventListener("change", function () {
    var files = Array.prototype.slice.call(inputAudio.files);
    if (!files.length) return;
    var defaultName = files[0].name.replace(/\.[^.]+$/, "");
    nameSheet("给这个书单起个名字", defaultName, function (name) {
      if (!name) return;
      var bookId = Date.now();
      idbPut("books", { id: bookId, name: name }).then(function () {
        var chain = Promise.resolve();
        files.forEach(function (f, i) {
          chain = chain.then(function () {
            return idbPut("tracks", {
              bookId: bookId,
              name: f.name,
              base: f.name.replace(/\.[^.]+$/, ""),
              blob: f,
              order: i
            });
          });
        });
        return chain;
      }).then(function () {
        showMsg("书单「" + name + "」已创建");
        return refreshBooks();
      }).then(function () {
        return openBook(bookId);
      }).then(function () {
        setTimeout(function () { inputSrt.click(); }, 400);
      });
    });
  });

  function playTrack(i) {
    if (i < 0 || i >= tracks.length) return;
    curTrack = i;
    var t = tracks[i];
    audio.src = t.url;
    // 尝试恢复该文件的上次播放进度
    pendingResume = null;
    try {
      var raw = localStorage.getItem(saveKey(t.base));
      if (raw) {
        var o = JSON.parse(raw);
        if (o && isFinite(o.t) && o.t > 3) pendingResume = o.t;
      }
    } catch (e) {}
    try { localStorage.setItem("tl_bookpos_" + curBookId, JSON.stringify({ i: i })); } catch (e) {}
    elFileName.textContent = t.name;
    elPlyBook.textContent = "《" + curBookName + "》 · 第 " + (i + 1) + " / " + tracks.length + " 集";
    // 自动配对同名字幕
    cues = srtMap[t.base] || [];
    activeIdx = -1;
    renderSubtitles();
    tTotal.textContent = "00:00";
    if (cues.length) {
      showMsg("「" + t.base + "」已匹配同名字幕（" + cues.length + " 条）");
    } else if (Object.keys(srtMap).length) {
      showMsg("「" + t.base + "」没有同名/已选字幕，可点「换字幕」手动选");
    } else {
      showMsg("还没有选择字幕文件，可点「换字幕」选择");
    }
    if ("mediaSession" in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: t.name, artist: "听书播放器" });
      } catch (e) {}
    }
    audio.play();
    highlightPlaylist();
  }

  audio.addEventListener("ended", function () {
    saveProgress();
    if (curTrack < tracks.length - 1) {
      playTrack(curTrack + 1);
    } else {
      setPlayBtn(false);
      showMsg("播放列表已播完");
    }
  });

  // ---------- 播放列表 UI ----------
  function renderPlaylist() {
    plList.innerHTML = "";
    var frag = document.createDocumentFragment();
    tracks.forEach(function (t, i) {
      var div = document.createElement("div");
      div.className = "pl-item";
      div.innerHTML =
        '<span class="num">' + (i + 1) + "</span>" +
        '<span class="nm">' + escapeHtml(t.name) + "</span>" +
        (srtMap[t.base] ? '<span class="tag">字幕</span>' : "") +
        '<span class="eq"><i></i><i></i><i></i></span>';
      div.addEventListener("click", function () {
        playTrack(i);
        plOverlay.classList.add("hidden");
      });
      frag.appendChild(div);
    });
    plList.appendChild(frag);
    highlightPlaylist();
  }

  function highlightPlaylist() {
    var items = plList.children;
    for (var i = 0; i < items.length; i++) {
      items[i].classList.toggle("current", i === curTrack);
    }
  }

  $("btn-list").addEventListener("click", function () {
    if (!tracks.length) { showMsg("播放列表为空"); return; }
    plOverlay.classList.remove("hidden");
    var pc = $("pl-count");
    if (pc) pc.textContent = tracks.length + " 集";
    var cur = plList.children[curTrack];
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "center" });
  });
  $("pl-close").addEventListener("click", function () { plOverlay.classList.add("hidden"); });
  plOverlay.addEventListener("click", function (e) {
    if (e.target === plOverlay) plOverlay.classList.add("hidden");
  });

  $("btn-books").addEventListener("click", function () {
    saveProgress();
    elPlayer.classList.add("hidden");
    elSetup.classList.remove("hidden");
    refreshBooks();
  });

  $("btn-srt").addEventListener("click", function () { inputSrt.click(); });
  inputSrt.addEventListener("change", function () {
    var files = Array.prototype.slice.call(inputSrt.files);
    if (!files.length) return;
    var pending = files.length, okCount = 0, matchedCur = false, pairCount = 0;
    var trackBases = {};
    tracks.forEach(function (t) { trackBases[t.base] = true; });
    files.forEach(function (f) {
      var reader = new FileReader();
      reader.onload = function () {
        var content = decodeSubtitle(new Uint8Array(reader.result));
        var parsed = parseSrt(content);
        var base = f.name.replace(/\.[^.]+$/, "");
        if (parsed.length) {
          srtMap[base] = parsed;
          idbPut("srts", { base: base, text: content });
          okCount++;
          if (trackBases[base]) pairCount++;
          if (curTrack >= 0 && tracks[curTrack] && tracks[curTrack].base === base) {
            cues = parsed;
            activeIdx = -1;
            renderSubtitles();
            highlight(audio.currentTime || 0);
            matchedCur = true;
          }
        }
        if (--pending === 0) {
          renderPlaylist(); // 刷新列表里的 📄 配对标记
          if (okCount === 0) {
            showMsg("字幕解析失败：文件里没找到有效的时间轴");
          } else if (matchedCur) {
            showMsg("字幕已加载并配对当前曲目（" + cues.length + " 条），点击字幕可跳转");
          } else if (pairCount > 0) {
            showMsg("已加载 " + okCount + " 个字幕，其中 " + pairCount + " 个与音频同名配对成功");
          } else {
            showMsg("已加载 " + okCount + " 个字幕，但没有一个和音频同名，可点右上角列表查看");
          }
        }
      };
      reader.onerror = function () {
        if (--pending === 0) showMsg("部分字幕读取失败");
      };
      reader.readAsArrayBuffer(f);
    });
  });

  // ---------- 播放控制 ----------
  btnPlay.addEventListener("click", function () {
    if (!audio.src) return;
    audio.paused ? audio.play() : audio.pause();
  });
  audio.addEventListener("play", function () { setPlayBtn(true); });
  audio.addEventListener("pause", function () { setPlayBtn(false); saveProgress(); });

  $("btn-back").addEventListener("click", function () { audio.currentTime = Math.max(0, audio.currentTime - 15); });
  $("btn-fwd").addEventListener("click", function () { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 15); });

  speedSel.addEventListener("change", function () {
    audio.playbackRate = parseFloat(speedSel.value);
    saveSettings();
  });
  // 恢复上次的倍速设置
  try {
    var savedSpeed = localStorage.getItem("tl_speed");
    if (savedSpeed && parseFloat(savedSpeed) > 0) {
      speedSel.value = savedSpeed;
      audio.playbackRate = parseFloat(savedSpeed);
    }
  } catch (e) {}

  seek.addEventListener("input", function () {
    if (audio.duration) audio.currentTime = seek.value / 1000 * audio.duration;
  });

  audio.addEventListener("timeupdate", function () {
    if (audio.duration) {
      seek.value = audio.currentTime / audio.duration * 1000;
      seek.style.setProperty("--fill", (seek.value / 10) + "%");
    }
    tCur.textContent = fmt(audio.currentTime);
    if (cues.length) highlight(audio.currentTime);
    if (Date.now() - lastSaved > 3000) {
      saveProgress();
      lastSaved = Date.now();
    }
  });
  audio.addEventListener("loadedmetadata", function () {
    tTotal.textContent = fmt(audio.duration);
    // 恢复进度：快播完的视为已听完，从头开始
    if (pendingResume != null) {
      if (audio.duration && pendingResume > audio.duration - 5) {
        audio.currentTime = 0;
      } else {
        audio.currentTime = pendingResume;
        showMsg("已恢复上次进度 " + fmt(pendingResume));
      }
      pendingResume = null;
    }
  });
  audio.addEventListener("ended", function () { setPlayBtn(false); });
  audio.addEventListener("error", function () {
    if (audio.src) showMsg("音频无法播放，可能是浏览器不支持该格式，建议用 mp3 / m4a / wav");
  });

  // 锁屏 / 通知栏控制（安卓 Chrome 支持）
  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", function () { audio.play(); });
    navigator.mediaSession.setActionHandler("pause", function () { audio.pause(); });
    navigator.mediaSession.setActionHandler("seekbackward", function () { audio.currentTime -= 15; });
    navigator.mediaSession.setActionHandler("seekforward", function () { audio.currentTime += 15; });
  }

  // ---------- 定时关闭 ----------
  var sleepDeadline = 0, sleepTick = null;

  function updateSleepUI(remaining) {
    if (remaining <= 0) {
      sleepPill.classList.remove("show", "open", "warn");
      btnSleep.classList.remove("on");
      return;
    }
    sleepPill.classList.add("show");
    btnSleep.classList.add("on");
    var mins = Math.floor(remaining / 60000);
    var secs = Math.floor(remaining % 60000 / 1000);
    spTime.textContent = "剩余 " + mins + ":" + (secs < 10 ? "0" : "") + secs;
    sleepPill.classList.toggle("warn", remaining < 60000);
  }

  // 点胶囊本体展开/收起 +5 和 取消 按钮，4 秒无操作自动收起
  var pillTimer = null;
  $("sp-toggle").addEventListener("click", function () {
    sleepPill.classList.toggle("open");
    clearTimeout(pillTimer);
    if (sleepPill.classList.contains("open")) {
      pillTimer = setTimeout(function () { sleepPill.classList.remove("open"); }, 4000);
    }
  });

  function startSleep(minutes) {
    stopSleep(true);
    sleepDeadline = Date.now() + minutes * 60000;
    sleepTick = setInterval(function () {
      var remaining = sleepDeadline - Date.now();
      if (remaining <= 0) {
        audio.pause();
        stopSleep();
        showMsg("定时时间到，已暂停播放");
        return;
      }
      updateSleepUI(remaining);
    }, 500);
    updateSleepUI(minutes * 60000);
    showMsg("将在 " + minutes + " 分钟后暂停播放");
  }

  function stopSleep(silent) {
    clearInterval(sleepTick);
    sleepTick = null;
    sleepDeadline = 0;
    if (!silent) updateSleepUI(0);
  }

  btnSleep.addEventListener("click", function () {
    var ov = openSheet(
      '<div class="sheet-title">定时关闭<span class="sc">到点自动暂停，适合伴睡</span></div>' +
      '<div class="sheet-quick">' +
        [15, 30, 45, 60].map(function (m) {
          return '<button class="qchip" data-m="' + m + '"><b>' + m + '</b>分钟</button>';
        }).join("") +
      "</div>" +
      '<input class="sheet-input" id="sinput" type="number" inputmode="numeric" placeholder="或输入自定义分钟数" value="30">' +
      '<div class="sheet-actions">' +
        '<button class="sheet-btn" id="scancel">取消</button>' +
        '<button class="sheet-btn primary" id="sstart">开始</button>' +
      "</div>"
    );
    function pick(m) {
      ov.close();
      startSleep(m);
    }
    ov.querySelectorAll(".qchip").forEach(function (b) {
      b.addEventListener("click", function () { pick(parseInt(b.dataset.m, 10)); });
    });
    ov.querySelector("#sstart").addEventListener("click", function () {
      var n = parseFloat(ov.querySelector("#sinput").value);
      if (!isFinite(n) || n <= 0) { showMsg("请输入有效的分钟数"); return; }
      pick(Math.round(n));
    });
    ov.querySelector("#scancel").addEventListener("click", function () { ov.close(); });
  });
  btnSleepAdd.addEventListener("click", function () {
    if (!sleepDeadline) return;
    sleepDeadline += 5 * 60000;
    showMsg("已加时 5 分钟");
  });
  btnSleepCancel.addEventListener("click", function () {
    stopSleep();
    showMsg("已取消定时关闭");
  });
})();
</script>
</body>
</html>

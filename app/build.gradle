plugins {
    id 'com.android.application'
}

android {
    namespace 'com.iuhz.audiobookplayer'
    compileSdk 34

    defaultConfig {
        applicationId "com.iuhz.audiobookplayer"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    signingConfigs {
        common {
            storeFile file("keystore/release.keystore")
            storePassword "audiobook123"
            keyAlias "audiobook"
            keyPassword "audiobook123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.common
        }
        debug {
            signingConfig signingConfigs.common
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
